name: Flutter CI

on:
  # Run on every push and PR so Android + iOS buildability is always checked.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android_checks_and_apk:
    name: Android checks + APK (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Android tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk (release)
        run: flutter build apk --release

      - name: flutter build web (release)
        run: flutter build web --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  ios_no_codesign:
    name: iOS no-codesign build (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Keep macOS usage minimal: restore deps then do no-codesign iOS build.
      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build ios --no-codesign
        run: flutter build ios --no-codesign
