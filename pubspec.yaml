name: daily_reset
description: "Daily Reset helps you build better habits and track your mood with a simple, elegant interface designed for busy people who want calm, focus, and control."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter_timezone: ^5.0.0
  timezone: 0.10.1
  flutter_local_notifications: ^19.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.0.0
  go_router: ^17.0.0
  shared_preferences: ^2.0.0
  uuid: ^4.0.0
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/workouts/
    - assets/workouts/headers/
    - assets/exercises/
    - assets/programs/
    - assets/onboarding/
    - assets/badges/
